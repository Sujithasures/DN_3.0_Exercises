spring.application.name=EmployeeManagementSystem
# Primary DataSource configuration (e.g., H2)
spring.datasource.primary.url=jdbc:h2:mem:primarydb
spring.datasource.primary.driverClassName=org.h2.Driver
spring.datasource.primary.username=sa
spring.datasource.primary.password=password
spring.jpa.primary.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Secondary DataSource configuration (e.g., MySQL)
spring.datasource.secondary.url=jdbc:mysql://localhost:3306/secondarydb
spring.datasource.secondary.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.secondary.username=root
spring.datasource.secondary.password=rootpassword
spring.jpa.secondary.database-platform=org.hibernate.dialect.MySQLDialect
# Enable SQL logging
spring.jpa.show-sql=true

# Format the SQL output
spring.jpa.properties.hibernate.format_sql=true

# Disable second-level caching for simplicity (optional)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false

# Set batch size for batch processing
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Enable statistics for performance tuning (optional)
spring.jpa.properties.hibernate.generate_statistics=true
